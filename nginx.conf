# nginx config template: the image renders it with envsubst at start-up
# (/etc/nginx/templates -> /etc/nginx/conf.d), so ${CSP_MEDIA_SOURCES} comes from the environment.

# TLS terminates at the edge proxy (Caddy). Trust the scheme it reports; fall back to our own.
map $http_x_forwarded_proto $knox_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Hashed build assets are immutable; the SPA shell must always be revalidated; API responses
# keep the API's own caching headers (an empty value adds no header).
map $uri $knox_cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    ~^/api/     "";
    /healthz    "";
    default     "no-cache";
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Only small images are uploaded through the API; course materials go straight to object storage.
    client_max_body_size 12m;

    # The client address, as seen by the edge proxy on the private container network.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Headers live at server level only: a location with its own add_header would drop these.
    add_header Cache-Control $knox_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Scripts only from this origin. Styles allow inline (Radix/Recharts set style attributes).
    # Images, video and direct uploads also reach object storage / the CDN (CSP_MEDIA_SOURCES).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: ${CSP_MEDIA_SOURCES}; media-src 'self' blob: ${CSP_MEDIA_SOURCES}; connect-src 'self' ${CSP_MEDIA_SOURCES}; font-src 'self' data:; frame-src https://www.youtube.com https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # The API is only reachable through this proxy. It trusts one X-Forwarded-For hop, so send exactly
    # the real client address (never a client-supplied chain).
    location /api/ {
        proxy_pass http://backend:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $knox_forwarded_proto;
        proxy_read_timeout 120s;
    }

    # Readiness for uptime monitors: the API answers and reaches its database and storage.
    location = /healthz {
        access_log off;
        proxy_pass http://backend:5001/health/ready;
        proxy_http_version 1.1;
        proxy_read_timeout 10s;
    }

    location /assets/ {
        try_files $uri =404;
    }

    # SPA fallback: React Router handles client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
